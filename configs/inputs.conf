# Splunk UF: collect Windows Security Event Log (render XML to preserve fields)
# Put this file in: C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf

[WinEventLog://Security]
disabled = 0
renderXml = 1
# Optional: whitelist/blacklist to reduce noise; left commented for lab use
# whitelist = EventCode=4625|4624
