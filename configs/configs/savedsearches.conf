# Saved Search: Brute-force detection (correlates multiple 4625 failed logons)
# Place this stanza in $SPLUNK_HOME/etc/system/local/savedsearches.conf
# Or create in Splunk UI with the SPL below and configure email action.

[Brute Force: Failed Logon Burst]
action.email = 1
action.email.to = soc-team@example.com
action.email.subject = Brute-force login attempts detected on $result.Host$
action.email.message = Host: $result.Host$\nUser: $result.TargetUserName$\nSource IP: $result.IpAddress$\nCount: $result.count$\nTime Window: $result._time$\n\nSearch Link: $result.search$
action.email.sendresults = 1
cron_schedule = */5 * * * *
disabled = 0
dispatch.earliest_time = -5m@m
dispatch.latest_time = now
search = index=wineventlog OR index=windows EventCode=4625
 | bin _time span=5m
 | stats count by TargetUserName IpAddress Host _time FailureReason
 | where count >= 5
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
alert.suppress = 1
alert.suppress.period = 10m
action.email.format = table
description = Detects >=5 failed logons (EventID 4625) per user/IP/host within a 5 minute window and sends email alerts with context.
